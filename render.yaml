services:
  - type: web
    name: tree-nursery-app
    env: node
    plan: free
    region: frankfurt
    buildCommand: ./render-build.sh
    startCommand: npm run start
    rootDir: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tree-nursery-db
          property: connectionString

databases:
  - name: tree-nursery-db
    plan: free
    region: frankfurt